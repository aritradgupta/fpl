[project]
name = "fpl"
version = "0.1.0"
description = "EPL Fantasy Premier League Team Creator & Recommendation Engine"
readme = "README.md"
authors = [
    { name = "Aritra Dattagupta", email = "dattagupta.aritra@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "aiosqlite>=0.22.1",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "pandas>=3.0.5",
    "pulp>=3.3.2",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "rich>=15.0.0",
    "scikit-learn>=1.9.0",
    "torch>=2.6.0",
    "uvicorn>=0.52.1",
]

[project.scripts]
fpl = "fpl:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pandas-stubs>=3.0.5.260730",
    "pytest>=9.1.1",
    "ruff>=0.16.2",
]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu124" },
]

[tool.ruff]
target-version = "py313"
line-length = 120
src = ["src", "analysis", "tests", "scripts"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
]
ignore = [
    "E501", # line length handled by ruff format
    "B008", # FastAPI Query/Field parameter defaults idiom
]
